version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: telegram-ai-gateway-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n_password}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - telegram-ai-gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.29.8
    container_name: telegram-ai-gateway-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_password}

      # Basic Auth
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}

      # Webhook URL (optional)
      - WEBHOOK_URL=${WEBHOOK_URL}

      # Security
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n-files
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true

      # Code Node (console.log output)
      - CODE_ENABLE_STDOUT=true

      # Timezone
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}

      # Logging
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}

      # Executions
      - EXECUTIONS_MODE=regular
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all

    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_files:/home/node/.n8n-files

    networks:
      - telegram-ai-gateway

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local

networks:
  telegram-ai-gateway:
    driver: bridge