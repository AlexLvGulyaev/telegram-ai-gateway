version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: telegram-ai-gateway-test-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n_password}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telegram-ai-gateway-test

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.29.8
    container_name: telegram-ai-gateway-test-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5680}:5678"
    environment:
      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_password}

      # Basic Auth
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}

      # Webhook URL (for webhook mode)
      - WEBHOOK_URL=${WEBHOOK_URL}

      # Timezone
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}

      # Logging
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}

      # Execution mode
      - EXECUTIONS_MODE=regular

      # Code Node (console.log output)
      - CODE_ENABLE_STDOUT=true

      # Security
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n-files
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true

    volumes:
      - n8n_test_data:/home/node/.n8n
      - ./workflows:/home/node/workflows:ro
      - ./migrations:/home/node/migrations:ro
    networks:
      - telegram-ai-gateway-test
      - n8n_default

volumes:
  postgres_test_data:
  n8n_test_data:

networks:
  telegram-ai-gateway-test:
    driver: bridge
  n8n_default:
    external: true